<!DOCTYPE html>
<html>
<head>
    <title>Pavala Malli Terminal</title>
    <style>
        body {
            background-color: black;
            color: #00ff99;
            font-family: monospace;
            padding: 20px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div id="output"></div>

<script>
const lyrics = `ஒரு நகிலை வைத்துனு தவில அடிக்க  
மச்சானைப் பார்த்து திக்குறேனே  
மச்சானைப் பார்த்து திக்குறேனே  
என் மச்சானைப் பார்த்து திக்க  

அடி எத்தனை சொப்பனம்  
உன்னால் சேர்ந்தது  
ராவைப் பார்த்து விக்குறேனே  
இந்த ராத்திரியை பார்த்து விக்குறேனே  
ஜோரம் ஆனேனே  

ரெட்டாடா ரெண்டாக மொத்தம்  
கட்டுன் சோடா  
அப்பத்தா கிறாக்க வெக்கத்த  
விட்டு வாடா  
என்ன நீ கூட  
விட்டுருக்கலான்டா  
நிழலா உன்ன நான் ஒட்டி  
இருப்பேண்டா`;

let i = 0;

function typeEffect() {
    if (i < lyrics.length) {
        document.getElementById("output").innerHTML += lyrics.charAt(i);
        i++;
        setTimeout(typeEffect, 35);
    }
}

typeEffect();
</script>

</body>
</html>
